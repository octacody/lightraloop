<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lightra Loop</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #bdbdbd;
      margin-bottom: 30px;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      background: #00a3ee;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #008ac7;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 Lightra Loop</h1>

    <p>
      تطبيق حديث يقدم تجربة بسيطة وسريعة.
      حمّل التطبيق الآن وابدأ الاستخدام.
    </p>

    <!-- زر التحميل -->
    <a class="btn"
       href="https://drive.google.com/uc?export=download&id=1r1bTG29PzMnW5V-5Cx8lk45nPfyWvIMJ"
       target="_blank">
      📥 تحميل التطبيق APK
    </a>

    <div class="footer">
      © 2026 Lightra Loop - All Rights Reserved
    </div>

  </div>

</body>
</html>
