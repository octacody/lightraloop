  <title>Lightraloop · لايترا لوب</title>
  <style>
    @font-face {
      font-family: 'LamaSans';
      src: url('assets/fonts/LamaSans-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000000;
      font-family: 'LamaSans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .landing {
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-wrapper {
      margin-bottom: 2.5rem;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .logo {
      height: auto;
      max-width: 280px;
      width: 100%;
      filter: drop-shadow(0 8px 18px rgba(255, 255, 255, 0.05));
      transition: transform 0.2s ease;
          margin-top: -70px;
    }

    .logo:hover {
      transform: scale(1.01);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      padding: 3px 5px;
      font-size: 1.20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      backdrop-filter: blur(4px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      line-height: 1.2;
      margin-top: -40px;
    }

    .btn:hover {
      background: white;
      color: black;
      border-color: white;
      transform: scale(1.02);
      box-shadow: 0 10px 24px rgba(255, 255, 255, 0.12);
    }

    .btn:active {
      transform: scale(0.98);
      background: #eaeaea;
      border-color: #eaeaea;
    }

    /* subtle responsive touch */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .logo {
        max-width: 240px;
      }
      .btn {
        font-size: 0.5rem;
        padding: 5px 15px;
        max-width: 300px;
      }
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
